name: "ix-integration-plc"
version: 0.0.0
type: app
targets:
  - "1500"
  - llvm  
devDependencies:
  "@ax/sdk": 2510.12.0   
dependencies:
  "@ax/system-strings": ^10.0.24    
variables:
  APAX_BUILD_ARGS: [ -d, -O ]
  # Do not commit any changes to the following variables. You may modify them locally, but committing the changes will mess up the template functionality. =>
  PLC_NAME: "plc_line"
  DEFAULT_NAMESPACE: "axosimple"
  AXTARGET: 192.168.100.85
  AXTARGETPLATFORMINPUT: .\bin\1500\
  AX_USERNAME: "admin"
  AX_TARGET_PWD: "123ABCDabcd$#!"
  USE_PLC_SIM_ADVANCED: "false"
  HWCONFIG: "HWC"
  COM_CERT_PATH: .\certs\Communication.cer
scripts:
  ixc: dotnet run --project ..\\..\\..\\AXSharp.compiler\\src\\ixc\\AXSharp.ixc.csproj --framework net10.0
  #ixd: dotnet run --project ..\\..\\..\\AXSharp.compiler\\src\\ixr\\AXSharp.ixr.csproj --framework net10.0
  postbuild:
    - apax ixc
    #- apax ixd
  alf:  
    dotnet axdev alf --namespace $DEFAULT_NAMESPACE -n $PLC_NAME -t $AXTARGET --platform $AXTARGETPLATFORMINPUT -u $AX_USERNAME $SIM_FLAG $FORCE_FLAG
  swfdo:
    dotnet axdev swfdo -n $PLC_NAME -t $AXTARGET --platform $AXTARGETPLATFORMINPUT -u $AX_USERNAME
installStrategy: overridable
apaxVersion: 3.1.0

