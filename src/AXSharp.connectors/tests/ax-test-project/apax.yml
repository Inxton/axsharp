name: "ax_test_project"
version: 0.0.0
type: app
targets:
  - "1500"
  - llvm
variables:
  # AXTARGET: $AXTARGET
  # AXTARGETPLATFORMINPUT: $AXTARGETPLATFORMINPUT
  # AX_USERNAME: $AX_USERNAME
  # AX_TARGET_PWD: $AX_TARGET_PWD
  # MY_VERY_STRONG_PASSWORD: $AX_TARGET_PWD
  COM_CERT_PATH: .\certs\Communication.cer

devDependencies:
  "@ax/sdk": 2405.2.0
  "@ax/sld": ^3.0.6-alpha
scripts:
  postbuild: dotnet run --project ..//..//..//AXSharp.compiler//src//ixc//AXSharp.ixc.csproj --framework net9.0
  download: apax sld load --accept-security-disclaimer -t $AXTARGET -i $AXTARGETPLATFORMINPUT -r -C $COM_CERT_PATH --password $AX_TARGET_PWD --username $AX_USERNAME
installStrategy: overridable
apaxVersion: 3.1.0
