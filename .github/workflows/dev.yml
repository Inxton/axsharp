name: dev

on:
  push:
    branches: [ "dev" ]
    paths:
     - 'src/**'
     - 'cake/**'
     - '.github/**'  
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: false
        default: false
        description: "Set to 'true' to publish packages"
jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: [self-hosted, Windows, X64, L2, AX]  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: '0'   
                   
    - name: "Build  script"  
      run: dotnet build cake/Build.csproj
                       
    - name: "Run build script"
      env:
          GH_TOKEN : ${{ secrets.GH_TOKEN }}
      run: dotnet run --project cake/Build.csproj --do-test true --do-pack true --test-level 2 --framework net9.0
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Test report
        path: 'TestResults/*.xml'     
        reporter: dotnet-trx
    - name: "Publish packages"
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        GH_USER: ${{ secrets.GH_USER }}
      run: dotnet run --project cake/Build.csproj --do-publish
